<body>
    <form>
        <p>
            <label>Число: <input type="number" id="num" min="1"></label>
        </p>
        <p>
            <label>Задание:
                <select id="task">
                    <option value="0">Число простое?</option>
                    <option value="1">Число является полным квадратом?</option>
                    <option value="2">Число совершенное?</option>
                </select> </label>
        </p>
        <p>
            <label>Результат<br>
            <textarea id="output" rows="6" cols="40"></textarea></label>
        </p>
        <p>
            <input type="button" value="Выполнить">
            <input type="reset" value="Очистить">
        </p>
    </form>
</body>
